version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      # MongoDB — matches the db service defined below
      DATABASE_URL: mongodb://codeshare:codeshare@mongo:27017/codeshare
      MONGODB_DB: codeshare
      PORT: 3001
      FRONTEND_URL: https://yourdomain.com   # ← change this
      # AWS S3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-codeshare-devs}
    depends_on:
      db:
        condition: service_healthy
    # Don't expose 3001 publicly — nginx proxies to it internally
    expose:
      - "3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_DATABASE: codeshare
      MONGO_INITDB_USER: codeshare
      MONGO_INITDB_PASSWORD: codeshare
    volumes:
      - db_data:/data/db
    # Only expose internally; remove the ports block for production
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
